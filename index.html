<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f6f0">
  <title>EARTH'S SYMPHONY | SONOVA</title>
  <link rel="stylesheet" href="landing.css">
</head>

<body>
  <div class="page">
    <header class="navbar">
      <a class="brand" href="index.html" aria-label="SONOVA home">
        <span class="brand-icon">✦</span>
        SONOVA
      </a>
      <span class="nav-label">NASA SPACE APPS CHALLENGE 2026</span>
    </header>

    <main class="hero">

      <!-- The Earth (real NASA night lights, drawn in landing.js) -->
      <div class="earth-stage" aria-hidden="true">
        <div class="art-glow"></div>
        <div class="orbit orbit-1"></div>
        <div class="orbit orbit-2"></div>
        <div class="orbit orbit-3"></div>
        <canvas id="earth" width="560" height="560"></canvas>
        <div class="floating-point point-1"></div>
        <div class="floating-point point-2"></div>
        <div class="floating-point point-3"></div>
      </div>

      <div class="copy">
        <!-- appears after the question -->
        <div class="title-wrap">
          <div class="title-inner">
            <div class="eyebrow">
              <span class="signal-dot"></span>
              
            </div>
            <h1>
              EARTH'S
              <span>SYMPHONY<span class="period">.</span></span>
            </h1>
            <p class="tagline">Where Data Becomes Sound.</p>
          </div>
        </div>

        <p class="question">
          What if you could <strong>hear</strong> the Earth
          instead of only seeing it?
        </p>

        <a class="enter-button" href="explorer.html">
          <span>Enter the Jukebox</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </main>


    <footer class="footer">
      <span>© 2026 SONOVA</span>
      <span>DON'T JUST SEE THE EARTH. HEAR IT.</span>
    </footer>
  </div>

  <script src="landing.js"></script>
</body>
</html>
